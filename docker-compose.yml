# Version
version: "3.8"

# Services
services:
  # Aplikasi
  item-app:
    # Image GitHub Packages
    image: ghcr.io/hidawaa/item-app:v1
    container_name: item-app

    # Port
    ports:
      - "80:8080"

    # Tunggu item-db aktif
    depends_on:
      - item-db

    # Restart otomatis
    restart: always

  # Database
  item-db:
    image: mongo:3
    container_name: item-db

    # Mount volume
    volumes:
      - app-db:/data/db

    # Restart otomatis
    restart: always

# Volume
volumes:
  app-db:
